<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход Queen Discord</title>
<style>
body { font-family: 'Poppins', sans-serif; background: #1a1a2e; color: #fff; display:flex; justify-content:center; align-items:center; height:100vh; }
.container { background: rgba(255,255,255,0.05); padding:40px 50px; border-radius:20px; width:350px; box-shadow:0 10px 30px rgba(255,76,96,0.5);}
h2 { text-align:center; margin-bottom:30px; color:#ff4c60;}
input { width:100%; padding:12px; margin-bottom:20px; border:none; border-radius:10px; background:#2a2a4a; color:#fff; }
input:focus { outline:2px solid #ff4c60; }
button { width:100%; padding:12px; border:none; border-radius:10px; background:#ff4c60; color:#fff; font-weight:700; cursor:pointer; transition:0.3s;}
button:hover { background:#ff2e50; transform:scale(1.05);}
.error { color:#ff4c60; font-size:0.9rem; margin-bottom:15px; text-align:center;}
.success { color:#0f0; font-size:0.9rem; margin-bottom:15px; text-align:center;}
</style>
</head>
<body>

<div class="container">
<h2>Вход</h2>
<div id="message"></div>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Пароль">
<button id="loginBtn">Войти</button>
<p style="text-align:center;margin-top:15px;">Нет аккаунта? <a href="register.html" style="color:#ff85a2;">Зарегистрироваться</a></p>
</div>

<script>
const loginBtn = document.getElementById('loginBtn');
const messageDiv = document.getElementById('message');

loginBtn.addEventListener('click', ()=>{
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    messageDiv.innerHTML='';

    if(!email || !password){
        messageDiv.innerHTML='<div class="error">Все поля обязательны</div>';
        return;
    }

    let users = JSON.parse(localStorage.getItem('users')) || [];
    let user = users.find(u=>u.email===email && u.password===password);

    if(user){
        // Сохраняем текущего пользователя в localStorage
        localStorage.setItem('currentUser', JSON.stringify(user));
        messageDiv.innerHTML='<div class="success">Вход успешен! Добро пожаловать, '+user.username+'</div>';
        setTimeout(()=>{ window.location.href='index.html'; }, 1500);
    } else {
        messageDiv.innerHTML='<div class="error">Неверный email или пароль</div>';
    }
});
</script>

</body>
</html>
